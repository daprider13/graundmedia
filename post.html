        }

        .nav-right {

            align-items: center;
            gap: 15px;
            justify-content: flex-end;
        }

        .social-icons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .social-icons a {
            color: #222222;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            transition: transform 0.2s;
        }

        .social-icons a.disabled-icon {
            cursor: default;
            pointer-events: none;
            opacity: 0.6;
        }

        .social-icons a svg {
            width: 18px;
            height: 18px;
            fill: #222222;
            transition: fill 0.2s;
        }

        .social-icons a:not(.disabled-icon):hover svg { fill: #e60023; }
        .social-icons a:not(.disabled-icon):hover { transform: translateY(-1px); }

        .btn-nav-shop {
            background-color: #e60023;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: background 0.2s;
            text-transform: uppercase;
        }

        .btn-nav-shop:hover { background-color: #ad081b; }

        .blog-container {
            max-width: 900px;
            margin: 15px auto 40px auto;
            padding: 0 20px;
            display: block;
        }

        .single-post-view {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #eaeaea;
        }

        .btn-back-blog {
            background: #111;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 15px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-back-blog:hover { background: #333; }

        .single-post-title {
            font-size: 24px;
            color: #111;
            margin: 0 0 8px 0;
        }

        .post-meta {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .single-post-body {
            font-size: 15px;
            line-height: 1.8;
            color: #333;
            margin-top: 10px;
            white-space: pre-line;
        }

        .single-post-body p { margin-bottom: 12px; }

        .footer-space-1 { width: 100%; height: 30px; background-color: #e9ecef; margin-top: 30px; }

            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {

    </div>

    <script>
        let blogPosts = JSON.parse(localStorage.getItem('graund_posts')) || [];

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = parseInt(urlParams.get('id'));

            const post = blogPosts.find(p => p.id === postId);
            const contentContainer = document.getElementById("singlePostContent");

            if (!post) {
                contentContainer.innerHTML = `<p style="color: #666; font-style: italic;">Post not found.</p>`;
                return;
            }

            contentContainer.innerHTML = `
                <div class="post-meta">${post.categoria} — ${post.fecha}</div>
                <h1 class="single-post-title">${post.titulo}</h1>
                <div style="width:100%; max-height:400px; overflow:hidden; border-radius:8px; margin:15px 0;">
                    <img src="${post.imagen}" alt="${post.titulo}" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div class="single-post-body">
                    ${post.contenido}
                </div>
            `;
        });
    </script>
