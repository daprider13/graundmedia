<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NON Originalis — Official Drop Site</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* TOP NAVIGATION BAR STATUS */
        .top-nav {
            position: sticky;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 25px;
            background-color: rgba(13, 13, 13, 0.95);
            border-bottom: 1px solid #222222;
            z-index: 1000;
        }

        .drop-status-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-closed {
            background-color: #222222;
            color: #ff3333;
            border: 1px solid #ff3333;
        }

        .status-open {
            background-color: #ff3333;
            color: #000000;
        }

        /* HERO SECTION */
        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 50px 20px 30px 20px;
        }

        .logo-circle-container {
            width: 130px;
            height: 130px;
            background-color: #1a1a1a;
            border: 2px dashed #ff3333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .logo-circle-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .brand-slogan { 
            font-size: 12px; 
            letter-spacing: 4px; 
            color: #888888; 
            font-weight: 600; 
            text-transform: uppercase;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div id="statusBadge" class="drop-status-badge status-closed">DROP CLOSED</div>
    </nav>

    <div class="hero-section">
        <div class="logo-circle-container">
            <img src="logoN/logo.jpg" alt="NON Originalis Logo">
        </div>
        <div class="brand-slogan">Limited Releases / No Restocks</div>
    </div>

    <script>
        /* DROP CONFIGURATION */
        const dropConfig = {
            activo: false, // Set to "true" on launch day (24-48h window)
            linkVentaAbierta: "https://your-store.com/checkout-non-originalis" // URL when active === true
        };

        function renderPage() {
            const badge = document.getElementById('statusBadge');
            
            // Update Status Badge
            if (dropConfig.activo) {
                badge.innerText = "DROP LIVE";
                badge.className = "drop-status-badge status-open";
            } else {
                badge.innerText = "DROP CLOSED";
                badge.className = "drop-status-badge status-closed";
            }
        }

        document.addEventListener('DOMContentLoaded', renderPage);
    </script>
</body>
</html>
