<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NON Originalis — Official Drop Site</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* TOP NAVIGATION BAR STATUS */
        .top-nav {
            position: sticky;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 25px;
            background-color: rgba(13, 13, 13, 0.95);
            border-bottom: 1px solid #222222;
            z-index: 1000;
        }

        .drop-status-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-closed {
            background-color: #222222;
            color: #ff3333;
            border: 1px solid #ff3333;
        }

        .status-open {
            background-color: #ff3333;
            color: #000000;
        }

        /* HERO SECTION */
        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        .logo-circle-container {
            width: 130px;
            height: 130px;
            background-color: #1a1a1a;
            border: 2px dashed #ff3333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .logo-circle-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .brand-slogan { 
            font-size: 12px; 
            letter-spacing: 4px; 
            color: #888888; 
            font-weight: 600; 
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* DROP CARDS CONTAINER */
        .drop-container {
            max-width: 1200px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
        }

        .drop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            justify-content: center;
        }

        /* PRODUCT CARD STYLE MATCHING HOME */
        .pin-card {
            background: #1a1a1a; 
            border-radius: 16px;
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s ease; 
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
        }
        .pin-card:hover { transform: translateY(-4px); }
        
        .pin-card-img-container {
            width: 100%;
            height: 240px;
            background-color: #222;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pin-card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
            position: relative;
            z-index: 2;
        }

        .product-name-label {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            padding: 12px 10px 0 10px;
            white-space: normal;
            overflow: hidden;
            line-height: 1.4;
            text-transform: uppercase;
        }

        .pin-footer { 
            padding: 10px 12px 14px 12px; 
            display: flex; 
            justify-content: flex-end; 
            background: #1a1a1a; 
            margin-top: auto; 
        }

        .btn-shop {
            background-color: #ff3333; 
            color: #000; 
            padding: 6px 14px;
            border-radius: 20px; 
            text-decoration: none; 
            font-size: 13px;
            font-weight: bold; 
            transition: background 0.2s;
            text-transform: uppercase;
        }
        .btn-shop:hover { background-color: #cc0000; color: #fff; }

        .btn-shop.disabled {
            background-color: #333;
            color: #777;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div id="statusBadge" class="drop-status-badge status-closed">DROP CLOSED</div>
    </nav>

    <div class="hero-section">
        <div class="logo-circle-container">
            <img src="logoN/logo.jpg" alt="NON Originalis Logo">
        </div>
        <div class="brand-slogan">Limited Releases / No Restocks</div>
    </div>

    <div class="drop-container">
        <div class="drop-grid" id="dropGrid"></div>
    </div>

    <script>
        const dropConfig = {
            activo: true, // Cambiar a true cuando el drop esté activo
            linkVentaAbierta: "https://your-store.com/checkout-non-originalis"
        };

        const dropItems = [
            { nombre: "NON Drop Brand", link: "https://www.spreadshirt.com/shop/design/non+originalis+by+graunddsgn+unisex+oversized+heavyweight+t-shirt-D3215431eb2a3e703?sellable=rf2bosmsiw3n-2844" },

            { nombre: "NON Drop standard", link: "https://www.spreadshirt.com/shop/design/standard+mens+premium+t-shirt-D321737a596b916a0?sellable=rf7qrl496qw0-812" },

           
        ];

        function renderPage() {
            const badge = document.getElementById('statusBadge');
            const grid = document.getElementById('dropGrid');
            
            if (!grid) return;

            if (dropConfig.activo) {
                badge.innerText = "DROP LIVE";
                badge.className = "drop-status-badge status-open";
            } else {
                badge.innerText = "DROP CLOSED";
                badge.className = "drop-status-badge status-closed";
            }

            grid.innerHTML = "";
            dropItems.forEach((item, index) => {
                const numeroItem = index + 1;
                const rutaImagen = `DROP NW/N0N${numeroItem}.jpg`;
                const card = document.createElement("div");
                card.className = "pin-card";
                
                const buttonHref = dropConfig.activo ? item.link : "#";
                const buttonClass = dropConfig.activo ? "btn-shop" : "btn-shop disabled";
                const buttonText = dropConfig.activo ? "BUY" : "CLOSED";

                card.innerHTML = `
                    <div class="pin-card-img-container">
                        <img src="${rutaImagen}" alt="${item.nombre}" onerror="this.src='DROP NW/N0N2.jpg">
                    </div>
                    <div class="product-name-label" title="${item.nombre}">${item.nombre}</div>
                    <div class="pin-footer">
                        <a href="${buttonHref}" target="_blank" class="${buttonClass}">${buttonText}</a>
                    </div>`;
                grid.appendChild(card);
            });
        }

        // Asegura la ejecución inmediata al cargar la página
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderPage);
        } else {
            renderPage();
        }
    </script>
</body>
</html>
